
name: Build ToDo4ToDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir app
          unzip -o ToDo4ToDay_version_1.1.zip -d app

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: app
        run: flutter create . --platforms=android

      - name: Enable core library desugaring
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              path = groovy
              setting = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          elif kotlin.exists():
              path = kotlin
              setting = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              raise SystemExit("Android app Gradle file not found")

          content = path.read_text()

          if setting not in content:
              content, count = re.subn(
                  r"(compileOptions\s*\{)",
                  r"\1\n        " + setting,
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("compileOptions block not found")

          if dependency not in content:
              match = re.search(r"dependencies\s*\{", content)
              if match:
                  pos = match.end()
                  content = content[:pos] + "\n    " + dependency + content[pos:]
              else:
                  content += "\ndependencies {\n    " + dependency + "\n}\n"

          path.write_text(content)
          print("Core library desugaring enabled successfully")
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToDo4ToDay-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
