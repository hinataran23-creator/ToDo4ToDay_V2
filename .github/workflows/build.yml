
name: Build ToDo4ToDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir app
          unzip -o source.zip -d app

       
      - name: Make app startup resilient
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/lib/main.dart")
          source = path.read_text()

          start = source.index("Future<void> main() async {")
          end = source.index("\nconst brown", start)

          replacement = """Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            try {
              tzdata.initializeTimeZones();
              tz.setLocalLocation(tz.getLocation('Africa/Antananarivo'));

              const init = InitializationSettings(
                android: AndroidInitializationSettings('@mipmap/ic_launcher'),
              );

              await notifications.initialize(init);

              await notifications
                  .resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>()
                  ?.requestNotificationsPermission();
            } catch (e, stack) {
              debugPrint('Notification initialization failed: $e');
              debugPrintStack(stackTrace: stack);
            }

            runApp(const ToDo4ToDayApp());
          }
          """

          path.write_text(source[:start] + replacement + source[end:])
          print("Startup protection applied")
          PY


       
      - name: Fix notification scheduling parameter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/lib/main.dart")
          source = path.read_text()

          target = "await notifications.zonedSchedule("
          if target not in source:
              raise SystemExit("zonedSchedule call not found")

          if "uiLocalNotificationDateInterpretation:" not in source:
              source = source.replace(
                  target,
                  target + "\n    uiLocalNotificationDateInterpretation: UILocalNotificationDateInterpretation.absoluteTime,",
                  1
              )

          path.write_text(source)
          print("Notification scheduling parameter added")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: app
        run: flutter create . --platforms=android

       
      - name: Configure Android notifications
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'

          if "android.permission.RECEIVE_BOOT_COMPLETED" not in content:
              content = content.replace("<application", permission + "\n    <application", 1)

          receivers = """
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />

                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          """

          if "ScheduledNotificationReceiver" not in content:
              content = content.replace("</application>", receivers + "\n    </application>", 1)

          path.write_text(content)
          print("Android notification receivers configured")
          PY


      - name: Enable core library desugaring
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              path = groovy
              setting = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          elif kotlin.exists():
              path = kotlin
              setting = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              raise SystemExit("Android app Gradle file not found")

          content = path.read_text()

          if setting not in content:
              content, count = re.subn(
                  r"(compileOptions\s*\{)",
                  r"\1\n        " + setting,
                  content,
                  count=1
              )
              if count == 0:
                  raise SystemExit("compileOptions block not found")

          if dependency not in content:
              match = re.search(r"dependencies\s*\{", content)
              if match:
                  pos = match.end()
                  content = content[:pos] + "\n    " + dependency + content[pos:]
              else:
                  content += "\ndependencies {\n    " + dependency + "\n}\n"

          path.write_text(content)
          print("Core library desugaring enabled successfully")
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate application icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToDo4ToDay-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
